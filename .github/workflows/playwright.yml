name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  release-lock-install:
    name: release-lock-install
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: ./backend/requirements.lock.txt
    - name: Clean install release lock
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r ./backend/requirements.lock.txt
    - name: Record resolved release closure identity
      run: |
        python <<'PY'
        import hashlib
        import subprocess
        import sys
        from pathlib import Path

        lock_path = Path("./backend/requirements.lock.txt")
        lock_text = lock_path.read_text(encoding="utf-8")
        if "--require-hashes" not in lock_text:
            raise SystemExit("Release lock must require hashes.")

        freeze = subprocess.check_output(
            [sys.executable, "-m", "pip", "freeze", "--all"],
            text=True,
        )
        print(f"requirements.lock.txt sha256: {hashlib.sha256(lock_path.read_bytes()).hexdigest()}")
        print(f"pip freeze --all sha256: {hashlib.sha256(freeze.encode('utf-8')).hexdigest()}")
        PY
    - name: Assert release build info
      env:
        DB_INIT_MODE: none
        PROJECT6_SOURCE_SHA: ${{ github.sha }}
        PYTHONPATH: ./backend
      run: |
        python <<'PY'
        import json

        import main

        class Session:
            def __enter__(self):
                return self

            def __exit__(self, *_exc):
                return None

            def execute(self, _statement):
                return None

        main.SessionLocal = lambda: Session()
        response = main.ready()
        payload = json.loads(response.body.decode("utf-8"))
        assert response.status_code == 200
        assert payload["build"] == {
            "version": main.BUILD_INFO["version"],
            "source_sha": main.BUILD_INFO["source_sha"],
        }
        PY
    - name: Run release identity contract test
      env:
        DB_INIT_MODE: none
        PROJECT6_SOURCE_SHA: ${{ github.sha }}
      run: |
        python -m pip install pytest
        python -m pytest ./backend/tests/test_release_identity.py -q
    - name: Build release app image
      run: |
        docker build --build-arg PROJECT6_SOURCE_SHA="${GITHUB_SHA}" -f Dockerfile.app -t project6-release-identity:${GITHUB_SHA} .

  backend-layer3-api-shard:
    name: backend-layer3-api-shard-${{ matrix.shard }}/4
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: ./backend/tests/requirements-layer3-api.txt
    - name: Install Layer 3 API test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r ./backend/tests/requirements-layer3-api.txt
    - name: Run focused Layer 3 backend pytest guardrail
      env:
        PYTEST_SHARD_INDEX: ${{ matrix.shard }}
        PYTEST_SHARD_TOTAL: 4
      run: |
        SECONDS=0
        python <<'PY'
        import glob
        import os
        import subprocess
        import sys

        shard = int(os.environ["PYTEST_SHARD_INDEX"])
        total = int(os.environ["PYTEST_SHARD_TOTAL"])
        if shard < 1 or shard > total:
            raise SystemExit(f"Invalid backend pytest shard {shard}/{total}")

        # Backend API test families gated by CI. The list is mirrored by
        # backend/tests/test_ci_coverage_completeness.py so newly added backend
        # test files cannot silently miss the shard.
        patterns = (
            "test_admission_evaluator_*.py",
            "test_aps_retrieval_*.py",
            "test_backend_config.py",
            "test_ci_coverage_completeness.py",
            "test_deployment_profile_*.py",
            "test_diagnostics_ref_*.py",
            "test_dual_live_sciencebase_producer.py",
            "test_egress_effect_boundary.py",
            "test_sciencebase_live_readiness.py",
            "test_sciencebase_spent_marker.py",
            "test_honesty_*.py",
            "test_legacy_api_*.py",
            "test_layer3_*.py",
            "test_market_*.py",
            "test_analyst_*.py",
            "test_nrc_aps_*.py",
            "test_pre_body_*.py",
            "test_review_browser_*.py",
            "test_review_nrc_aps_candidate_b_trace_*.py",
            "test_review_nrc_aps_document_trace_page.py",
            "test_review_nrc_aps_gate_reports.py",
            "test_review_nrc_aps_operator_identity*.py",
            "test_review_nrc_aps_page.py",
            "test_review_nrc_aps_workbench_compare_*.py",
            "test_release_*.py",
            "test_sec_refs.py",
            "test_sec_xbrl_*.py",
            "test_support_matrix.py",
            "test_visual_artifact_*.py",
        )
        files = sorted({
            f for pat in patterns for f in glob.glob(f"./backend/tests/{pat}")
        })
        if not files:
            raise SystemExit("No backend API test files found.")

        collect = subprocess.run(
            [sys.executable, "-m", "pytest", "--collect-only", "-q", *files],
            capture_output=True,
            text=True,
        )
        if collect.returncode != 0:
            sys.stdout.write(collect.stdout)
            sys.stderr.write(collect.stderr)
            raise SystemExit(collect.returncode)

        nodeids = [
            line.strip()
            for line in collect.stdout.splitlines()
            if "::" in line and line.strip().startswith("backend/tests/")
        ]
        if not nodeids:
            raise SystemExit("Layer 3 backend pytest collection produced no nodeids.")

        selected = [
            nodeid
            for index, nodeid in enumerate(nodeids)
            if index % total == shard - 1
        ]
        if not selected:
            raise SystemExit(
                f"Layer 3 backend pytest shard {shard}/{total} selected no tests "
                f"from {len(nodeids)} collected tests."
            )

        print(
            f"Layer 3 backend pytest shard {shard}/{total} selected "
            f"{len(selected)} of {len(nodeids)} tests."
        )
        completed = subprocess.run([sys.executable, "-m", "pytest", *selected, "-q"])
        raise SystemExit(completed.returncode)
        PY
        echo "backend_layer3_api_shard_${{ matrix.shard }}_seconds=$SECONDS"

  backend-layer3-api:
    name: backend-layer3-api
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: backend-layer3-api-shard
    if: ${{ always() }}
    steps:
    - name: Check backend shard results
      run: |
        if [ "${{ needs.backend-layer3-api-shard.result }}" != "success" ]; then
          echo "Layer 3 backend pytest shard result: ${{ needs.backend-layer3-api-shard.result }}"
          exit 1
        fi
        echo "All Layer 3 backend pytest shards passed."

  root-tests-shard:
    name: root-tests-shard-${{ matrix.shard }}/4
    timeout-minutes: 25
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: ./backend/tests/requirements-layer3-api.txt
    - name: Install root test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r ./backend/tests/requirements-layer3-api.txt
    - name: Run repo-root pytest guardrail
      env:
        PYTEST_ROOT_SHARD_INDEX: ${{ matrix.shard }}
        PYTEST_ROOT_SHARD_TOTAL: 4
      run: |
        SECONDS=0
        python <<'PY'
        import glob
        import os
        import subprocess
        import sys

        shard = int(os.environ["PYTEST_ROOT_SHARD_INDEX"])
        total = int(os.environ["PYTEST_ROOT_SHARD_TOTAL"])
        if shard < 1 or shard > total:
            raise SystemExit(f"Invalid root pytest shard {shard}/{total}")

        # Repo-root tests are not covered by backend/tests shards. They are
        # intentionally collected from root and sharded separately to keep
        # root harness, NRC APS, parser, and structural tests visible in CI.
        files = sorted(glob.glob("./tests/test_*.py"))
        if not files:
            raise SystemExit("No repo-root pytest files found.")

        collect = subprocess.run(
            [sys.executable, "-m", "pytest", "--collect-only", "-q", *files],
            capture_output=True,
            text=True,
        )
        if collect.returncode != 0:
            sys.stdout.write(collect.stdout)
            sys.stderr.write(collect.stderr)
            raise SystemExit(collect.returncode)

        nodeids = [
            line.strip()
            for line in collect.stdout.splitlines()
            if "::" in line and line.strip().startswith("tests/")
        ]
        if not nodeids:
            raise SystemExit("Repo-root pytest collection produced no nodeids.")

        selected = [
            nodeid
            for index, nodeid in enumerate(nodeids)
            if index % total == shard - 1
        ]
        if not selected:
            raise SystemExit(
                f"Repo-root pytest shard {shard}/{total} selected no tests "
                f"from {len(nodeids)} collected tests."
            )

        print(
            f"Repo-root pytest shard {shard}/{total} selected "
            f"{len(selected)} of {len(nodeids)} tests."
        )
        completed = subprocess.run([sys.executable, "-m", "pytest", *selected, "-q"])
        raise SystemExit(completed.returncode)
        PY
        echo "root_tests_shard_${{ matrix.shard }}_seconds=$SECONDS"

  root-tests:
    name: root-tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: root-tests-shard
    if: ${{ always() }}
    steps:
    - name: Check root test shard results
      run: |
        if [ "${{ needs.root-tests-shard.result }}" != "success" ]; then
          echo "Repo-root pytest shard result: ${{ needs.root-tests-shard.result }}"
          exit 1
        fi
        echo "All repo-root pytest shards passed."

  sec-xbrl-arelle-provisioning:
    name: sec-xbrl-arelle-provisioning
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          ./backend/tests/requirements-layer3-arelle.txt
          ./backend/tests/requirements-layer3-api.txt
          ./backend/requirements-sec-xbrl.txt
    - name: Install optional SEC XBRL Arelle dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r ./backend/tests/requirements-layer3-arelle.txt
    - name: Provision pinned SEC XBRL taxonomy packages
      env:
        SEC_XBRL_ARELLE_TAXONOMY_DIR: ${{ runner.temp }}/sec-xbrl-taxonomy
        SEC_XBRL_ARELLE_CACHE_DIR: ${{ runner.temp }}/sec-xbrl-cache
      run: |
        python ./tools/sec-xbrl-arelle-provision.py \
          --taxonomy-dir "$SEC_XBRL_ARELLE_TAXONOMY_DIR" \
          --cache-dir "$SEC_XBRL_ARELLE_CACHE_DIR" \
          --report "$RUNNER_TEMP/sec-xbrl-arelle-provisioning-report.json"
    - name: Run Arelle readiness and fail-closed tests
      env:
        SEC_XBRL_ARELLE_TAXONOMY_PACKAGES: ${{ runner.temp }}/sec-xbrl-taxonomy/us-gaap-2025.zip:${{ runner.temp }}/sec-xbrl-taxonomy/srt-2025.zip
        SEC_XBRL_ARELLE_CACHE_DIR: ${{ runner.temp }}/sec-xbrl-cache
        SEC_XBRL_ARELLE_INTERNET_CONNECTIVITY: offline
      run: |
        python -m pytest \
          ./backend/tests/test_sec_xbrl_arelle_provisioning.py \
          ./backend/tests/test_sec_xbrl_arelle_helper.py \
          ./backend/tests/test_sec_xbrl_sidecar.py \
          ./backend/tests/test_sec_xbrl_a7_chain_ci_durability.py \
          ./backend/tests/test_sec_xbrl_value_reveal_authority_provisioning_preflight.py \
          ./backend/tests/test_sec_xbrl_stratified_real_filing_validation_matrix_preflight.py \
          ./backend/tests/test_sec_xbrl_a7_real_arelle_resolution.py \
          -q

  nrc-aps-ocr:
    name: nrc-aps-ocr
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: ./backend/tests/requirements-layer3-api.txt
    - name: Install Tesseract OCR
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr
        tesseract --version
    - name: Install NRC APS OCR test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r ./backend/tests/requirements-layer3-api.txt
    - name: Run NRC APS OCR proof with required OCR
      env:
        NRC_APS_CORPUS_OCR_MODE: required
      run: |
        set -euo pipefail
        proof_dir="$RUNNER_TEMP/nrc-aps-ocr"
        report="$proof_dir/document-processing-proof.json"
        mkdir -p "$proof_dir"

        set +e
        python tools/run_nrc_aps_document_processing_proof.py --require-ocr \
          --runtime-root "$proof_dir/runtime" \
          --report "$report" \
          --artifact-report "$proof_dir/artifact-ingestion-report.json" \
          --content-index-report "$proof_dir/content-index-report.json"
        proof_status=$?
        set -e

        if [ "$proof_status" -ne 0 ]; then
          echo "NRC APS OCR proof failed with exit code $proof_status"
          if [ -f "$report" ]; then
            python - "$report" <<'PY'
        import json
        import sys
        from pathlib import Path

        payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
        print("failure_reason=", payload.get("failure_reason"))
        print("tesseract_available=", payload.get("tesseract_available"))
        print("ocr_success_proven=", payload.get("ocr_success_proven"))
        for command in payload.get("commands") or []:
            print(
                "command=",
                command.get("label"),
                "exit=",
                command.get("exit_code"),
                "passed=",
                command.get("passed"),
            )
        PY
          fi
          exit "$proof_status"
        fi
    - name: Verify NRC APS OCR proof executed
      run: |
        set -euo pipefail
        python - <<'PY'
        import json
        import os
        from pathlib import Path

        report = Path(os.environ["RUNNER_TEMP"]) / "nrc-aps-ocr" / "document-processing-proof.json"
        payload = json.loads(report.read_text(encoding="utf-8"))
        failures = []
        if payload.get("ocr_mode") != "required":
            failures.append("ocr_mode_not_required")
        if payload.get("passed") is not True:
            failures.append("proof_not_passed")
        if payload.get("tesseract_available") is not True:
            failures.append("tesseract_not_available")
        if payload.get("ocr_success_proven") is not True:
            failures.append("ocr_success_not_proven")

        commands = payload.get("commands") or []
        labels = {command.get("label") for command in commands}
        for label in ("lower_layer_pytest", "api_proof_pytest"):
            if label not in labels:
                failures.append(f"missing_{label}")

        combined_output = "\n".join(
            str(command.get("stdout") or "") + "\n" + str(command.get("stderr") or "")
            for command in commands
        ).lower()
        for forbidden in (
            "tesseract unavailable",
            "tesseract_required",
            "ocr_required_but_unavailable",
            "skipped",
        ):
            if forbidden in combined_output:
                failures.append(f"forbidden_fallback:{forbidden}")

        if failures:
            raise SystemExit("NRC APS OCR proof did not execute cleanly: " + ", ".join(failures))

        print("NRC APS OCR proof executed with required OCR and real Tesseract.")
        PY

  playwright-shard:
    name: test-shard-${{ matrix.shard }}/4
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: ./package-lock.json
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          ./backend/tests/requirements-browser.txt
          ./backend/tests/requirements-layer3-api.txt
    - name: Install dependencies
      run: npm ci
    - name: Install browser harness dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r ./backend/tests/requirements-browser.txt
    - name: Install Playwright Browsers
      run: |
        SECONDS=0
        if command -v google-chrome >/dev/null 2>&1; then
          google-chrome --version
          echo "PLAYWRIGHT_USE_SYSTEM_CHROME=1" >> "$GITHUB_ENV"
        else
          timeout 600s npx playwright install --only-shell chromium
        fi
        echo "playwright_browser_install_seconds=$SECONDS"
    - name: Run Playwright tests
      env:
        PLAYWRIGHT_SHARD_INDEX: ${{ matrix.shard }}
        PLAYWRIGHT_SHARD_TOTAL: 4
      run: |
        SECONDS=0
        node <<'NODE'
        const { execSync } = require('node:child_process');
        const fs = require('node:fs');

        const shard = Number(process.env.PLAYWRIGHT_SHARD_INDEX);
        const total = Number(process.env.PLAYWRIGHT_SHARD_TOTAL);
        if (!Number.isInteger(shard) || !Number.isInteger(total) || shard < 1 || shard > total) {
          throw new Error(`Invalid Playwright shard ${shard}/${total}`);
        }

        const output = execSync('npx playwright test --list --project=chromium --reporter=json', {
          encoding: 'utf8',
          stdio: ['ignore', 'pipe', 'inherit'],
        });
        const data = JSON.parse(output);
        const specs = [];
        function visit(suite) {
          for (const spec of suite.specs || []) specs.push(spec.title);
          for (const child of suite.suites || []) visit(child);
        }
        for (const suite of data.suites || []) visit(suite);
        const selected = specs.filter((_, index) => index % total === shard - 1);
        if (!selected.length) {
          throw new Error(`Playwright shard ${shard}/${total} selected no tests from ${specs.length} specs`);
        }
        const escapeRegExp = (value) => value.replace(/[|\\{}()[\]^$+*?.]/g, '\\$&');
        fs.writeFileSync('playwright-shard-grep.txt', `(${selected.map(escapeRegExp).join('|')})`);
        console.log(`Playwright shard ${shard}/${total} selected ${selected.length} of ${specs.length} tests.`);
        NODE
        npx playwright test --project=chromium --grep "$(cat playwright-shard-grep.txt)"
        echo "playwright_test_shard_${{ matrix.shard }}_seconds=$SECONDS"
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-shard-${{ matrix.shard }}
        path: playwright-report/
        retention-days: 30

  backend-coverage:
    name: backend-coverage
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: ./backend/tests/requirements-layer3-api.txt
    - name: Install Layer 3 API test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r ./backend/tests/requirements-layer3-api.txt
    - name: Run Layer 3 coverage (xdist)
      # Targets: backend/app/api/layer3 package and the sec-xbrl in-app auth
      # policy service. Coverage floor is set to 90%, matching the enforced
      # --cov-fail-under=90 release threshold below.
      env:
        DB_INIT_MODE: none
      run: |
        cd backend
        python -m pytest tests/test_layer3_*.py -q -n auto \
          --cov=app.api.layer3 \
          --cov=app.services.layer3_sec_xbrl_in_app_auth_policy \
          --cov-report=term \
          --cov-fail-under=90

  backend-migrations-postgres:
    name: backend-migrations-postgres
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: ./backend/tests/requirements-layer3-api.txt
    - name: Install Layer 3 API test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r ./backend/tests/requirements-layer3-api.txt
    - name: Run alembic upgrade head against Postgres
      env:
        DB_INIT_MODE: none
        DATABASE_URL: postgresql+psycopg://testuser:testpassword@localhost:5432/testdb
      run: |
        cd backend
        python -m alembic -c alembic.ini upgrade head
    - name: Run Postgres migration tests
      env:
        DB_INIT_MODE: none
        DATABASE_URL: postgresql+psycopg://testuser:testpassword@localhost:5432/testdb
        LAYER3_MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://testuser:testpassword@localhost:5432/testdb
      run: |
        cd backend
        python -m pytest tests/test_layer3_migrations.py -v
    - name: Run 3C golden-path tests against Postgres
      env:
        DB_INIT_MODE: none
        DATABASE_URL: postgresql+psycopg://testuser:testpassword@localhost:5432/testdb
        LAYER3_GOLDEN_PATH_TEST_DATABASE_URL: postgresql+psycopg://testuser:testpassword@localhost:5432/testdb
      run: |
        cd backend
        python -m pytest tests/test_layer3_3c_golden_path.py -v

  dual-live-windows-boundary:
    name: dual-live-windows-boundary
    timeout-minutes: 30
    runs-on: windows-2025
    steps:
    - name: Enable Git long paths before checkout
      shell: pwsh
      run: git config --global core.longpaths true
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: ./backend/tests/requirements-layer3-api.txt
    - name: Install B0 boundary test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r ./backend/tests/requirements-layer3-api.txt
    - name: Provision pinned external B0 bundle and profile
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $archiveUrl = 'https://www.python.org/ftp/python/3.12.6/python-3.12.6-embed-amd64.zip'
        $archiveSha256 = 'a86a2e28870967745d255cc597d1e4d19ae79e65e927cdc324baa0256202231c'
        $tag = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
        $brokerName = "p6b0$($env:GITHUB_RUN_ATTEMPT)"
        $brokerPassword = 'P6!b0Ci9xQ2#'
        $moniker = "Project6.B0.CI.$($env:GITHUB_RUN_ID).$($env:GITHUB_RUN_ATTEMPT)"
        $stateRoot = "C:\p6-b0-state-$tag"
        $provisioningRoot = "C:\p6-b0-ci-$tag"
        $statePath = Join-Path $stateRoot 'state.json'
        @("PROJECT6_B0_STATE=$statePath", "PROJECT6_B0_PROVISIONING_ROOT=$provisioningRoot") | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        New-Item -ItemType Directory -Path $stateRoot, $provisioningRoot | Out-Null
        foreach ($root in @($stateRoot, $provisioningRoot)) {
          $rootItem = Get-Item -LiteralPath $root -Force
          if ([IO.DriveInfo]::new($rootItem.PSDrive.Root).DriveType -ne [IO.DriveType]::Fixed) { throw "B0 CI root is not on a fixed local drive: $root" }
          if (($rootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw "B0 CI root is a reparse point: $root" }
        }
        $profileScript = Join-Path $stateRoot 'profile.ps1'
        [ordered]@{ broker = $brokerName; password = $brokerPassword; moniker = $moniker; profile_created = $false; profile_script = $profileScript; state_root = $stateRoot; provisioning_root = $provisioningRoot } | ConvertTo-Json -Compress | Set-Content -LiteralPath $statePath -Encoding ascii
        & net.exe user $brokerName $brokerPassword /add /passwordchg:no
        if ($LASTEXITCODE -ne 0) { throw 'Could not create disposable standard broker account.' }
        & icacls.exe $stateRoot /inheritance:r /grant:r '*S-1-5-18:(OI)(CI)(F)' '*S-1-5-32-544:(OI)(CI)(F)' "$brokerName`:(OI)(CI)(M)"
        if ($LASTEXITCODE -ne 0) { throw 'Could not protect disposable CI state root.' }

        @'
        param([string]$Action, [string]$Moniker, [string]$OutputPath = '')
        $ErrorActionPreference = 'Stop'
        Add-Type @"
        using System;
        using System.Runtime.InteropServices;
        public static class P6AppContainer {
          [DllImport("userenv.dll", CharSet=CharSet.Unicode)] public static extern int CreateAppContainerProfile(string name, string display, string description, IntPtr capabilities, uint count, out IntPtr sid);
          [DllImport("userenv.dll", CharSet=CharSet.Unicode)] public static extern int DeleteAppContainerProfile(string name);
          [DllImport("userenv.dll", CharSet=CharSet.Unicode)] public static extern int DeriveAppContainerSidFromAppContainerName(string name, out IntPtr sid);
          [DllImport("userenv.dll", CharSet=CharSet.Unicode)] public static extern int GetAppContainerFolderPath(string sid, out IntPtr path);
          [DllImport("advapi32.dll", CharSet=CharSet.Unicode, SetLastError=true)] public static extern bool ConvertSidToStringSid(IntPtr sid, out IntPtr text);
          [DllImport("advapi32.dll")] public static extern IntPtr FreeSid(IntPtr sid);
          [DllImport("kernel32.dll")] public static extern IntPtr LocalFree(IntPtr value);
          [DllImport("ole32.dll")] public static extern void CoTaskMemFree(IntPtr value);
        }
        "@
        if ($Action -eq 'delete') {
          $hr = [P6AppContainer]::DeleteAppContainerProfile($Moniker)
          if ($hr -notin @(0, -2147023728)) { exit 1 }
          exit 0
        }
        $sid = [IntPtr]::Zero
        $hr = [P6AppContainer]::CreateAppContainerProfile($Moniker, $Moniker, $Moniker, [IntPtr]::Zero, 0, [ref]$sid)
        if ($hr -ne 0 -or $sid -eq [IntPtr]::Zero) { throw ('CreateAppContainerProfile failed: 0x{0:x8}' -f ($hr -band 0xffffffffL)) }
        try {
          $text = [IntPtr]::Zero
          if (-not [P6AppContainer]::ConvertSidToStringSid($sid, [ref]$text)) { throw 'Package SID conversion failed.' }
          try { $packageSid = [Runtime.InteropServices.Marshal]::PtrToStringUni($text) } finally { [void][P6AppContainer]::LocalFree($text) }
          $derived = [IntPtr]::Zero
          $hr = [P6AppContainer]::DeriveAppContainerSidFromAppContainerName($Moniker, [ref]$derived)
          if ($hr -ne 0 -or $derived -eq [IntPtr]::Zero) { throw ('DeriveAppContainerSidFromAppContainerName failed: 0x{0:x8}' -f ($hr -band 0xffffffffL)) }
          try {
            $derivedText = [IntPtr]::Zero
            if (-not [P6AppContainer]::ConvertSidToStringSid($derived, [ref]$derivedText)) { throw 'Derived Package SID conversion failed.' }
            try { if ([Runtime.InteropServices.Marshal]::PtrToStringUni($derivedText) -ne $packageSid) { throw 'Created and derived Package SID mismatch.' } } finally { [void][P6AppContainer]::LocalFree($derivedText) }
          } finally { [void][P6AppContainer]::FreeSid($derived) }
          $folder = [IntPtr]::Zero
          $hr = [P6AppContainer]::GetAppContainerFolderPath($packageSid, [ref]$folder)
          if ($hr -ne 0 -or $folder -eq [IntPtr]::Zero) { throw ('GetAppContainerFolderPath failed: 0x{0:x8}' -f ($hr -band 0xffffffffL)) }
          try { $profileRoot = [Runtime.InteropServices.Marshal]::PtrToStringUni($folder) } finally { [P6AppContainer]::CoTaskMemFree($folder) }
          $brokerProfileRoot = [Environment]::GetFolderPath([Environment+SpecialFolder]::UserProfile)
          $userDataRoot = Join-Path $brokerProfileRoot 'AppData\Local'
          New-Item -ItemType Directory -Path $userDataRoot -Force | Out-Null
          [ordered]@{
            appcontainer_profile_root = $profileRoot
            broker_profile_root = $brokerProfileRoot
            broker_sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
            package_sid = $packageSid
            user_data_root = $userDataRoot
          } | ConvertTo-Json -Compress | Set-Content -LiteralPath $OutputPath -Encoding ascii
        } finally { [void][P6AppContainer]::FreeSid($sid) }
        '@ | Set-Content -LiteralPath $profileScript -Encoding ascii
        $profileInfo = Join-Path $stateRoot 'profile.json'
        $secure = ConvertTo-SecureString $brokerPassword -AsPlainText -Force
        $credential = [Management.Automation.PSCredential]::new(".\$brokerName", $secure)
        $profileArgs = "-NoProfile -ExecutionPolicy Bypass -File `"$profileScript`" create `"$moniker`" `"$profileInfo`""
        $profileStdout = Join-Path $stateRoot 'profile.stdout.txt'
        $profileStderr = Join-Path $stateRoot 'profile.stderr.txt'
        $env:TEMP = $stateRoot
        $env:TMP = $stateRoot
        [ordered]@{ broker = $brokerName; password = $brokerPassword; moniker = $moniker; profile_created = $true; profile_script = $profileScript; state_root = $stateRoot; provisioning_root = $provisioningRoot } | ConvertTo-Json -Compress | Set-Content -LiteralPath $statePath -Encoding ascii
        $created = Start-Process powershell.exe -Credential $credential -LoadUserProfile -ArgumentList $profileArgs -RedirectStandardOutput $profileStdout -RedirectStandardError $profileStderr -Wait -PassThru
        if ($created.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $profileInfo)) {
          $detail = if (Test-Path -LiteralPath $profileStderr) { (Get-Content -Raw -LiteralPath $profileStderr).Trim() } else { 'no stderr' }
          throw "Disposable AppContainer profile creation failed (exit $($created.ExitCode)): $detail"
        }
        $profile = Get-Content -Raw -LiteralPath $profileInfo | ConvertFrom-Json

        $archive = Join-Path $stateRoot 'python.zip'
        Invoke-WebRequest -Uri $archiveUrl -OutFile $archive
        if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $archiveSha256) { throw 'Pinned Python.org archive SHA256 mismatch.' }
        $stage = Join-Path $provisioningRoot 'stage'
        Expand-Archive -LiteralPath $archive -DestinationPath $stage
        Get-ChildItem -LiteralPath $stage -Recurse -Force -File | Unblock-File
        $trackedWorkerFiles = @(
          'tools/dual_live_run.py',
          'backend/app/__init__.py',
          'backend/app/services/__init__.py',
          'backend/app/services/connector_egress_contract.py',
          'backend/app/services/dual_live_effect_guard.py',
          'backend/app/services/dual_live_sciencebase_producer.py',
          'backend/app/services/dual_live_worker_bundle.py',
          'backend/app/services/dual_live_windows_boundary.py'
        )
        foreach ($relative in $trackedWorkerFiles) {
          $destination = Join-Path $stage $relative
          New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $relative) -Destination $destination
          Unblock-File -LiteralPath $destination
        }

        $relativeFiles = @(Get-ChildItem -LiteralPath $stage -Recurse -File | ForEach-Object { [IO.Path]::GetRelativePath($stage, $_.FullName).Replace('\', '/') })
        [Array]::Sort($relativeFiles, [StringComparer]::Ordinal)
        $files = @()
        foreach ($relative in $relativeFiles) {
          $file = Get-Item -LiteralPath (Join-Path $stage $relative)
          $files += [ordered]@{ path = $relative; sha256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); size = $file.Length }
        }
        $manifest = [ordered]@{
          architecture = 'amd64'; entrypoint = 'tools/dual_live_run.py'; files = $files; interpreter = 'python.exe'
          principals = [ordered]@{ broker = $profile.broker_sid; owner = 'S-1-5-19'; package = $profile.package_sid; provisioner = 'S-1-5-20' }
          profile_moniker = $moniker; python_version = '3.12.6'; schema_version = 'project6.worker-bundle.v1'; source_commit = $env:GITHUB_SHA
        }
        $manifestBytes = [Text.Encoding]::ASCII.GetBytes(($manifest | ConvertTo-Json -Compress -Depth 8))
        $manifestDigest = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($manifestBytes)).ToLowerInvariant()
        [IO.File]::WriteAllBytes((Join-Path $stage 'worker-bundle.json'), $manifestBytes)
        $bundleRoot = Join-Path $provisioningRoot "sha256-$manifestDigest"
        Move-Item -LiteralPath $stage -Destination $bundleRoot
        $bindingPath = Join-Path $stateRoot 'binding.json'
        [ordered]@{
          root = $bundleRoot; provisioning_root = $provisioningRoot; profile_moniker = $moniker; manifest_digest = "sha256:$manifestDigest"
          source_commit = $env:GITHUB_SHA; entrypoint = 'tools/dual_live_run.py'; interpreter = 'python.exe'; python_version = '3.12.6'; architecture = 'amd64'
          package_sid = $profile.package_sid; owner_sid = 'S-1-5-19'; provisioner_sid = 'S-1-5-20'; broker_sid = $profile.broker_sid
          ambient_interpreter_root = Split-Path -Parent (Get-Command python).Source; repository_root = $env:GITHUB_WORKSPACE; campaign_root = $stateRoot
          appcontainer_profile_root = $profile.appcontainer_profile_root; broker_profile_root = $profile.broker_profile_root; user_data_root = $profile.user_data_root
        } | ConvertTo-Json -Compress | Set-Content -LiteralPath $bindingPath -Encoding ascii

        Get-ChildItem -LiteralPath $provisioningRoot -Recurse -Force | ForEach-Object { & icacls.exe $_.FullName /inheritance:r /grant:r '*S-1-5-18:(F)' '*S-1-5-32-544:(F)' | Out-Null }
        & icacls.exe $provisioningRoot /inheritance:r /grant:r '*S-1-5-18:(F)' '*S-1-5-32-544:(F)' | Out-Null
        if ($LASTEXITCODE -ne 0) { throw 'Could not establish deny-before-grant ACL.' }

        $sciencebaseProof = Join-Path $stateRoot 'sciencebase-proof.py'
        @'
        import json
        import sys
        from pathlib import Path

        from app.services.connector_egress_contract import EffectResult, RequestLimits
        from app.services.dual_live_effect_guard import BrokerEffectGuard, release_sciencebase_worker
        from app.services.dual_live_sciencebase_producer import ScienceBaseInput
        from app.services.dual_live_windows_boundary import WindowsEffectBoundary, open_pipe_writer
        from app.services.dual_live_worker_bundle import BundleBinding, WindowsBundleProbe

        class LocalBrokerTransport:
            def __init__(self):
                self.stages = []

            def execute(self, plan):
                self.stages.append(plan.stage)
                bodies = {
                    "sciencebase_search": json.dumps({"items": [{"id": "item-7"}]}).encode(),
                    "sciencebase_hydrate": json.dumps({"id": "item-7", "files": [{"name": "target.csv", "downloadUri": "https://www.sciencebase.gov/catalog/file/get/item-7?f=target.csv"}]}).encode(),
                    "sciencebase_download": b"a,b\n1,2\n",
                }
                if plan.stage not in bodies:
                    raise AssertionError("unexpected broker request")
                return EffectResult(
                    reservation_event_id=plan.slot_uuid,
                    plan_digest=plan.plan_digest,
                    status_code=200,
                    body=bodies[plan.stage],
                    response_header_names=("content-type",),
                )

        document = json.loads(Path(sys.argv[1]).resolve(strict=True).read_text(encoding="utf-8"))
        path_fields = {
            "root", "provisioning_root", "ambient_interpreter_root", "repository_root",
            "campaign_root", "appcontainer_profile_root", "broker_profile_root", "user_data_root",
        }
        binding = BundleBinding(**{
            key: Path(value) if key in path_fields else value
            for key, value in document.items()
        })
        boundary = WindowsEffectBoundary(
            str(binding.root), "b0-sciencebase-proof", bundle_binding=binding,
            bundle_probe=WindowsBundleProbe(binding),
        )
        request = ScienceBaseInput(
            query="critical minerals",
            expected_item_id="item-7",
            expected_file_name="target.csv",
            envelope_digest="sha256:" + "e" * 64,
            campaign_id="campaign-1",
            canonical_root=str(binding.root),
            connector_run_id="11111111-1111-4111-8111-111111111111",
            authorization_digest="sha256:" + "b" * 64,
            grant_digest="sha256:" + "c" * 64,
            max_total_bytes=4096,
            limits=RequestLimits(timeout_seconds=5.0, max_response_bytes=4096),
            max_redirect_hops=0,
            connector_run_target_id="target-1",
        )
        transport = LocalBrokerTransport()
        raw = [0, 0, 0, 0]
        with boundary.acquire():
            try:
                raw[:] = boundary.create_worker_pipes()
                boundary.launch_worker(tuple(raw[2:]), mode="sciencebase")
                for index in (2, 3):
                    boundary.close_pipe_handle(raw[index])
                    raw[index] = 0
                with open_pipe_writer(raw[1]) as writer:
                    raw[1] = 0
                    output = BrokerEffectGuard(transport).serve_sciencebase(
                        request, None, writer,
                        read_next=lambda: boundary.read_worker_frame(raw[0], 15_000),
                        consume_authority=lambda: True,
                    )
                    boundary.census()
                    release_sciencebase_worker(writer)
                    boundary.wait_worker(15_000)
            finally:
                for index, handle in enumerate(raw):
                    if handle:
                        boundary.close_pipe_handle(handle)
                        raw[index] = 0
        assert output.content == b"a,b\n1,2\n"
        assert output.request_count == 3
        assert transport.stages == ["sciencebase_search", "sciencebase_hydrate", "sciencebase_download"]
        print("sciencebase-bundle-proof-ok")
        '@ | Set-Content -LiteralPath $sciencebaseProof -Encoding ascii

        $testScript = Join-Path $stateRoot 'run-tests.ps1'
        @'
        param([string]$Python, [string]$Repo, [string]$Binding, [string]$Mode, [string]$Output, [string]$ScienceBaseProof)
        $env:PROJECT6_B0_BUNDLE_BINDING = $Binding
        $env:DB_INIT_MODE = 'none'
        $env:PYTHONDONTWRITEBYTECODE = '1'
        $env:PYTHONPATH = (Join-Path $Repo 'backend')
        Set-Location -LiteralPath $Repo
        if ($Mode -eq 'deny') {
          & $Python -m pytest -p no:cacheprovider ./tests/test_dual_live_worker_bundle.py::test_windows_probe_validates_preprovisioned_fixture -q *>&1 | Tee-Object -LiteralPath $Output
        } else {
          & $Python -m pytest -p no:cacheprovider ./backend/tests/test_egress_effect_boundary.py ./backend/tests/test_dual_live_sciencebase_producer.py ./backend/tests/test_sciencebase_live_readiness.py ./backend/tests/test_sciencebase_spent_marker.py ./tests/test_dual_live_effect_guard.py ./tests/test_dual_live_family_guard.py ./tests/test_dual_live_preservation_receipts.py ./tests/test_dual_live_python_binding.py ./tests/test_dual_live_worker_acl_filtered.py ./tests/test_dual_live_worker_bundle.py ./tests/test_dual_live_runtime.py ./tests/test_sciencebase_no_signature_rehearsal.py -q *>&1 | Tee-Object -LiteralPath $Output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Python $ScienceBaseProof $Binding
        }
        exit $LASTEXITCODE
        '@ | Set-Content -LiteralPath $testScript -Encoding ascii
        $python = (Get-Command python).Source
        $denyOutput = Join-Path $stateRoot 'deny.txt'
        $denyArgs = "-NoProfile -ExecutionPolicy Bypass -File `"$testScript`" `"$python`" `"$env:GITHUB_WORKSPACE`" `"$bindingPath`" deny `"$denyOutput`" `"$sciencebaseProof`""
        $denied = Start-Process powershell.exe -Credential $credential -LoadUserProfile -ArgumentList $denyArgs -Wait -PassThru
        if ($denied.ExitCode -eq 0 -or (Get-Content -Raw $denyOutput) -notmatch 'bundle_(observation_ambiguous|ancestor_invalid|dacl_mismatch)') { throw 'Deny B0 bundle before Package SID grant was not proven.' }

        $aclTargets = @($provisioningRoot) + @(Get-ChildItem -LiteralPath $provisioningRoot -Recurse -Force | ForEach-Object FullName)
        Add-Type @"
        using System;
        using System.Diagnostics;
        using System.Runtime.InteropServices;
        public static class P6RestorePrivilege {
          [StructLayout(LayoutKind.Sequential)] struct LUID { public uint LowPart; public int HighPart; }
          [StructLayout(LayoutKind.Sequential)] struct LUID_AND_ATTRIBUTES { public LUID Luid; public uint Attributes; }
          [StructLayout(LayoutKind.Sequential)] struct TOKEN_PRIVILEGES { public uint Count; public LUID_AND_ATTRIBUTES Privilege; }
          [DllImport("advapi32.dll", SetLastError=true)] static extern bool OpenProcessToken(IntPtr process, uint access, out IntPtr token);
          [DllImport("advapi32.dll", CharSet=CharSet.Unicode, SetLastError=true)] static extern bool LookupPrivilegeValue(string system, string name, out LUID luid);
          [DllImport("advapi32.dll", SetLastError=true)] static extern bool AdjustTokenPrivileges(IntPtr token, bool disableAll, ref TOKEN_PRIVILEGES state, uint length, IntPtr previous, IntPtr required);
          [DllImport("kernel32.dll")] static extern bool CloseHandle(IntPtr handle);
          public static void Enable() {
            IntPtr token;
            if (!OpenProcessToken(Process.GetCurrentProcess().Handle, 0x28, out token)) throw new InvalidOperationException("restore privilege token open failed");
            try {
              LUID luid;
              if (!LookupPrivilegeValue(null, "SeRestorePrivilege", out luid)) throw new InvalidOperationException("restore privilege lookup failed");
              TOKEN_PRIVILEGES state = new TOKEN_PRIVILEGES { Count = 1, Privilege = new LUID_AND_ATTRIBUTES { Luid = luid, Attributes = 2 } };
              Marshal.GetLastWin32Error();
              if (!AdjustTokenPrivileges(token, false, ref state, 0, IntPtr.Zero, IntPtr.Zero) || Marshal.GetLastWin32Error() != 0) throw new InvalidOperationException("restore privilege enable failed");
            } finally { CloseHandle(token); }
          }
        }
        "@
        [P6RestorePrivilege]::Enable()
        foreach ($target in $aclTargets) {
          $acl = Get-Acl -LiteralPath $target
          $acl.SetOwner([Security.Principal.SecurityIdentifier]::new('S-1-5-19'))
          Set-Acl -LiteralPath $target -AclObject $acl
          $observedOwner = ([Security.Principal.NTAccount](Get-Acl -LiteralPath $target).Owner).Translate([Security.Principal.SecurityIdentifier]).Value
          if ($observedOwner -ne 'S-1-5-19') { throw "Exact bundle owner assignment failed for $target" }
          & icacls.exe $target /grant:r '*S-1-5-18:(F)' '*S-1-5-32-544:(F)' '*S-1-5-19:(F)' '*S-1-5-20:(F)' "*$($profile.broker_sid):(RX)" "*$($profile.package_sid):(RX)" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Grant exact protected B0 bundle ACL failed for $target" }
        }
        [ordered]@{ broker = $brokerName; password = $brokerPassword; moniker = $moniker; profile_created = $true; profile_script = $profileScript; state_root = $stateRoot; provisioning_root = $provisioningRoot; binding = $bindingPath; test_script = $testScript; sciencebase_proof = $sciencebaseProof; python = $python } | ConvertTo-Json -Compress | Set-Content -LiteralPath $statePath -Encoding ascii
        "PROJECT6_B0_BUNDLE_BINDING=$bindingPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Prove B0 AppContainer and effect boundary
      env:
        DB_INIT_MODE: none
      shell: pwsh
      run: |
        $state = Get-Content -Raw -LiteralPath $env:PROJECT6_B0_STATE | ConvertFrom-Json
        $env:TEMP = $state.state_root
        $env:TMP = $state.state_root
        $secure = ConvertTo-SecureString $state.password -AsPlainText -Force
        $credential = [Management.Automation.PSCredential]::new(".\$($state.broker)", $secure)
        $output = Join-Path $state.state_root 'green.txt'
        $args = "-NoProfile -ExecutionPolicy Bypass -File `"$($state.test_script)`" `"$($state.python)`" `"$env:GITHUB_WORKSPACE`" `"$($state.binding)`" green `"$output`" `"$($state.sciencebase_proof)`""
        $proved = Start-Process powershell.exe -Credential $credential -LoadUserProfile -ArgumentList $args -Wait -PassThru
        Get-Content -LiteralPath $output
        if ($proved.ExitCode -ne 0) { throw 'External bundle B0 Windows proof failed.' }
    - name: Teardown disposable B0 profile and closure
      if: ${{ always() }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        if (-not $env:PROJECT6_B0_STATE) { exit 0 }
        if (-not (Test-Path -LiteralPath $env:PROJECT6_B0_STATE)) {
          foreach ($root in @($env:PROJECT6_B0_PROVISIONING_ROOT, (Split-Path -Parent $env:PROJECT6_B0_STATE))) {
            if ($root -and (Test-Path -LiteralPath $root)) {
              Remove-Item -LiteralPath $root -Recurse -Force
              if (Test-Path -LiteralPath $root) { throw "partial B0 root removal failed: $root" }
            }
          }
          exit 0
        }
        $state = Get-Content -Raw -LiteralPath $env:PROJECT6_B0_STATE | ConvertFrom-Json
        $env:TEMP = $state.state_root
        $env:TMP = $state.state_root
        $secure = ConvertTo-SecureString $state.password -AsPlainText -Force
        $credential = [Management.Automation.PSCredential]::new(".\$($state.broker)", $secure)
        $args = "-NoProfile -ExecutionPolicy Bypass -File `"$($state.profile_script)`" delete `"$($state.moniker)`""
        $teardownFailures = @()
        $profileDeleted = -not $state.profile_created
        if ($state.profile_created) {
          try {
            if (-not (Get-LocalUser -Name $state.broker -ErrorAction SilentlyContinue)) { throw 'broker account missing before profile deletion' }
            $deleted = Start-Process powershell.exe -Credential $credential -LoadUserProfile -ArgumentList $args -Wait -PassThru
            if ($deleted.ExitCode -ne 0) { throw 'AppContainer profile deletion failed' }
            $profileDeleted = $true
          } catch { $teardownFailures += $_.Exception.Message }
        }
        if (Test-Path -LiteralPath $state.provisioning_root) {
          try {
            & takeown.exe /F $state.provisioning_root /R /D Y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'disposable root ownership restore failed' }
            & icacls.exe $state.provisioning_root /grant:r '*S-1-5-32-544:(OI)(CI)(F)' /T /C | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'disposable root ACL restore failed' }
            Remove-Item -LiteralPath $state.provisioning_root -Recurse -Force
            if (Test-Path -LiteralPath $state.provisioning_root) { throw 'disposable root removal failed' }
          } catch { $teardownFailures += $_.Exception.Message }
        }
        if ($profileDeleted -and (Get-LocalUser -Name $state.broker -ErrorAction SilentlyContinue)) {
          & net.exe user $state.broker /delete | Out-Null
          if ($LASTEXITCODE -ne 0) { $teardownFailures += 'broker account removal failed' }
        } elseif (-not $profileDeleted) {
          $teardownFailures += 'broker account preserved for AppContainer profile cleanup retry'
        }
        if ($teardownFailures.Count -eq 0) {
          try {
            Remove-Item -LiteralPath $state.state_root -Recurse -Force
            if (Test-Path -LiteralPath $state.state_root) { throw 'disposable state root removal failed' }
          } catch { $teardownFailures += $_.Exception.Message }
        }
        if ($teardownFailures.Count) { throw ($teardownFailures -join '; ') }

  release-gate:
    name: release-gate
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs:
      - release-lock-install
      - backend-layer3-api
      - backend-coverage
      - backend-migrations-postgres
      - sec-xbrl-arelle-provisioning
      - root-tests
      - nrc-aps-ocr
      - dual-live-windows-boundary
      - test
    if: ${{ always() }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: ./backend/tests/requirements-layer3-api.txt
    - name: Install release gate dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r ./backend/tests/requirements-layer3-api.txt
    - name: Check manifest-backed CI jobs
      run: |
        set -euo pipefail
        failed=0
        for item in \
          "release-lock-install:${{ needs['release-lock-install'].result }}" \
          "backend-layer3-api:${{ needs['backend-layer3-api'].result }}" \
          "backend-coverage:${{ needs['backend-coverage'].result }}" \
          "backend-migrations-postgres:${{ needs['backend-migrations-postgres'].result }}" \
          "sec-xbrl-arelle-provisioning:${{ needs['sec-xbrl-arelle-provisioning'].result }}" \
          "root-tests:${{ needs['root-tests'].result }}" \
          "nrc-aps-ocr:${{ needs['nrc-aps-ocr'].result }}" \
          "dual-live-windows-boundary:${{ needs['dual-live-windows-boundary'].result }}" \
          "test:${{ needs['test'].result }}"
        do
          job="${item%%:*}"
          result="${item#*:}"
          if [ "$result" != "success" ]; then
            echo "Release gate dependency failed: $job -> $result"
            failed=1
          fi
        done
        exit "$failed"
    - name: Run release readiness manifest gate
      env:
        DB_INIT_MODE: none
        PROJECT6_SOURCE_SHA: ${{ github.sha }}
      run: |
        python ./scripts/release_readiness_check.py
    - name: Run final 0.3.0 SEC XBRL offline acceptance capstone
      env:
        DB_INIT_MODE: none
        PROJECT6_SOURCE_SHA: ${{ github.sha }}
        PROJECT6_CI_BACKEND_LAYER3_API_RESULT: ${{ needs['backend-layer3-api'].result }}
      run: |
        python ./scripts/rc3_sec_xbrl_offline_acceptance.py --json

  test:
    name: test
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: playwright-shard
    if: ${{ always() }}
    steps:
    - name: Check Playwright shard results
      run: |
        if [ "${{ needs.playwright-shard.result }}" != "success" ]; then
          echo "Playwright shard result: ${{ needs.playwright-shard.result }}"
          exit 1
        fi
        echo "All Playwright shards passed."
