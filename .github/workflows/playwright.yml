name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  backend-layer3-api:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: ./backend/tests/requirements-layer3-api.txt
    - name: Install Layer 3 API test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r ./backend/tests/requirements-layer3-api.txt
    - name: Run focused Layer 3 backend pytest guardrail
      run: python -m pytest ./backend/tests/test_layer3_*.py -q

  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: ./package-lock.json
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          ./backend/tests/requirements-browser.txt
          ./backend/tests/requirements-layer3-api.txt
    - name: Install dependencies
      run: npm ci
    - name: Install browser harness dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r ./backend/tests/requirements-browser.txt
    - name: Install Playwright Browsers
      run: |
        SECONDS=0
        npx playwright install --with-deps chromium
        echo "playwright_browser_install_seconds=$SECONDS"
    - name: Run Playwright tests
      run: |
        SECONDS=0
        npx playwright test --project=chromium
        echo "playwright_test_seconds=$SECONDS"
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
