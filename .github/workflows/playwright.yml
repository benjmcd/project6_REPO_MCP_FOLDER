name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  backend-layer3-api-shard:
    name: backend-layer3-api-shard-${{ matrix.shard }}/4
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: ./backend/tests/requirements-layer3-api.txt
    - name: Install Layer 3 API test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r ./backend/tests/requirements-layer3-api.txt
    - name: Run focused Layer 3 backend pytest guardrail
      env:
        PYTEST_SHARD_INDEX: ${{ matrix.shard }}
        PYTEST_SHARD_TOTAL: 4
      run: |
        SECONDS=0
        python <<'PY'
        import glob
        import os
        import subprocess
        import sys

        shard = int(os.environ["PYTEST_SHARD_INDEX"])
        total = int(os.environ["PYTEST_SHARD_TOTAL"])
        if shard < 1 or shard > total:
            raise SystemExit(f"Invalid backend pytest shard {shard}/{total}")

        files = sorted(glob.glob("./backend/tests/test_layer3_*.py"))
        if not files:
            raise SystemExit("No Layer 3 backend test files found.")

        collect = subprocess.run(
            [sys.executable, "-m", "pytest", "--collect-only", "-q", *files],
            capture_output=True,
            text=True,
        )
        if collect.returncode != 0:
            sys.stdout.write(collect.stdout)
            sys.stderr.write(collect.stderr)
            raise SystemExit(collect.returncode)

        nodeids = [
            line.strip()
            for line in collect.stdout.splitlines()
            if "::" in line and line.strip().startswith("backend/tests/")
        ]
        if not nodeids:
            raise SystemExit("Layer 3 backend pytest collection produced no nodeids.")

        selected = [
            nodeid
            for index, nodeid in enumerate(nodeids)
            if index % total == shard - 1
        ]
        if not selected:
            raise SystemExit(
                f"Layer 3 backend pytest shard {shard}/{total} selected no tests "
                f"from {len(nodeids)} collected tests."
            )

        print(
            f"Layer 3 backend pytest shard {shard}/{total} selected "
            f"{len(selected)} of {len(nodeids)} tests."
        )
        completed = subprocess.run([sys.executable, "-m", "pytest", *selected, "-q"])
        raise SystemExit(completed.returncode)
        PY
        echo "backend_layer3_api_shard_${{ matrix.shard }}_seconds=$SECONDS"

  backend-layer3-api:
    name: backend-layer3-api
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: backend-layer3-api-shard
    if: ${{ always() }}
    steps:
    - name: Check backend shard results
      run: |
        if [ "${{ needs.backend-layer3-api-shard.result }}" != "success" ]; then
          echo "Layer 3 backend pytest shard result: ${{ needs.backend-layer3-api-shard.result }}"
          exit 1
        fi
        echo "All Layer 3 backend pytest shards passed."

  playwright-shard:
    name: test-shard-${{ matrix.shard }}/4
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: ./package-lock.json
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          ./backend/tests/requirements-browser.txt
          ./backend/tests/requirements-layer3-api.txt
    - name: Install dependencies
      run: npm ci
    - name: Install browser harness dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r ./backend/tests/requirements-browser.txt
    - name: Install Playwright Browsers
      run: |
        SECONDS=0
        timeout 600s npx playwright install chromium
        echo "playwright_browser_install_seconds=$SECONDS"
    - name: Run Playwright tests
      env:
        PLAYWRIGHT_SHARD_INDEX: ${{ matrix.shard }}
        PLAYWRIGHT_SHARD_TOTAL: 4
      run: |
        SECONDS=0
        node <<'NODE'
        const { execSync } = require('node:child_process');
        const fs = require('node:fs');

        const shard = Number(process.env.PLAYWRIGHT_SHARD_INDEX);
        const total = Number(process.env.PLAYWRIGHT_SHARD_TOTAL);
        if (!Number.isInteger(shard) || !Number.isInteger(total) || shard < 1 || shard > total) {
          throw new Error(`Invalid Playwright shard ${shard}/${total}`);
        }

        const output = execSync('npx playwright test --list --project=chromium --reporter=json', {
          encoding: 'utf8',
          stdio: ['ignore', 'pipe', 'inherit'],
        });
        const data = JSON.parse(output);
        const specs = [];
        function visit(suite) {
          for (const spec of suite.specs || []) specs.push(spec.title);
          for (const child of suite.suites || []) visit(child);
        }
        for (const suite of data.suites || []) visit(suite);
        const selected = specs.filter((_, index) => index % total === shard - 1);
        if (!selected.length) {
          throw new Error(`Playwright shard ${shard}/${total} selected no tests from ${specs.length} specs`);
        }
        const escapeRegExp = (value) => value.replace(/[|\\{}()[\]^$+*?.]/g, '\\$&');
        fs.writeFileSync('playwright-shard-grep.txt', `(${selected.map(escapeRegExp).join('|')})`);
        console.log(`Playwright shard ${shard}/${total} selected ${selected.length} of ${specs.length} tests.`);
        NODE
        npx playwright test --project=chromium --grep "$(cat playwright-shard-grep.txt)"
        echo "playwright_test_shard_${{ matrix.shard }}_seconds=$SECONDS"
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-shard-${{ matrix.shard }}
        path: playwright-report/
        retention-days: 30

  test:
    name: test
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: playwright-shard
    if: ${{ always() }}
    steps:
    - name: Check Playwright shard results
      run: |
        if [ "${{ needs.playwright-shard.result }}" != "success" ]; then
          echo "Playwright shard result: ${{ needs.playwright-shard.result }}"
          exit 1
        fi
        echo "All Playwright shards passed."
