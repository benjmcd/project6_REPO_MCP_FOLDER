name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  release-lock-install:
    name: release-lock-install
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: ./backend/requirements.lock.txt
    - name: Clean install release lock
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r ./backend/requirements.lock.txt
    - name: Record resolved release closure identity
      run: |
        python <<'PY'
        import hashlib
        import subprocess
        import sys
        from pathlib import Path

        lock_path = Path("./backend/requirements.lock.txt")
        lock_text = lock_path.read_text(encoding="utf-8")
        if "--require-hashes" not in lock_text:
            raise SystemExit("Release lock must require hashes.")

        freeze = subprocess.check_output(
            [sys.executable, "-m", "pip", "freeze", "--all"],
            text=True,
        )
        print(f"requirements.lock.txt sha256: {hashlib.sha256(lock_path.read_bytes()).hexdigest()}")
        print(f"pip freeze --all sha256: {hashlib.sha256(freeze.encode('utf-8')).hexdigest()}")
        PY
    - name: Assert release build info
      env:
        DB_INIT_MODE: none
        PROJECT6_SOURCE_SHA: ${{ github.sha }}
        PYTHONPATH: ./backend
      run: |
        python <<'PY'
        import json

        import main

        class Session:
            def __enter__(self):
                return self

            def __exit__(self, *_exc):
                return None

            def execute(self, _statement):
                return None

        main.SessionLocal = lambda: Session()
        response = main.ready()
        payload = json.loads(response.body.decode("utf-8"))
        assert response.status_code == 200
        assert payload["build"] == {
            "version": main.BUILD_INFO["version"],
            "source_sha": main.BUILD_INFO["source_sha"],
        }
        PY
    - name: Run release identity contract test
      env:
        DB_INIT_MODE: none
        PROJECT6_SOURCE_SHA: ${{ github.sha }}
      run: |
        python -m pip install pytest
        python -m pytest ./backend/tests/test_release_identity.py -q
    - name: Build release app image
      run: |
        docker build --build-arg PROJECT6_SOURCE_SHA="${GITHUB_SHA}" -f Dockerfile.app -t project6-release-identity:${GITHUB_SHA} .

  backend-layer3-api-shard:
    name: backend-layer3-api-shard-${{ matrix.shard }}/4
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: ./backend/tests/requirements-layer3-api.txt
    - name: Install Layer 3 API test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r ./backend/tests/requirements-layer3-api.txt
    - name: Run focused Layer 3 backend pytest guardrail
      env:
        PYTEST_SHARD_INDEX: ${{ matrix.shard }}
        PYTEST_SHARD_TOTAL: 4
      run: |
        SECONDS=0
        python <<'PY'
        import glob
        import os
        import subprocess
        import sys

        shard = int(os.environ["PYTEST_SHARD_INDEX"])
        total = int(os.environ["PYTEST_SHARD_TOTAL"])
        if shard < 1 or shard > total:
            raise SystemExit(f"Invalid backend pytest shard {shard}/{total}")

        # Backend API test families gated by CI. The list is mirrored by
        # backend/tests/test_ci_coverage_completeness.py so newly added backend
        # test files cannot silently miss the shard.
        patterns = (
            "test_admission_evaluator_*.py",
            "test_aps_retrieval_*.py",
            "test_backend_config.py",
            "test_ci_coverage_completeness.py",
            "test_deployment_profile_*.py",
            "test_diagnostics_ref_*.py",
            "test_honesty_*.py",
            "test_legacy_api_*.py",
            "test_layer3_*.py",
            "test_market_*.py",
            "test_analyst_*.py",
            "test_nrc_aps_*.py",
            "test_nrc_phase_b_linkage.py",
            "test_pre_body_*.py",
            "test_review_browser_*.py",
            "test_review_nrc_aps_candidate_b_trace_*.py",
            "test_review_nrc_aps_document_trace_page.py",
            "test_review_nrc_aps_gate_reports.py",
            "test_review_nrc_aps_operator_identity*.py",
            "test_review_nrc_aps_page.py",
            "test_review_nrc_aps_workbench_compare_*.py",
            "test_release_*.py",
            "test_sec_refs.py",
            "test_sec_xbrl_*.py",
            "test_support_matrix.py",
            "test_visual_artifact_*.py",
            "test_arming_api.py",
            "test_campaign_log_capture.py",
            "test_connector_transport_loopback.py",
            "test_dual_live_dependencies.py",
            "test_dual_live_p4_faults.py",
            "test_egress_arming.py",
            "test_egress_auth.py",
            "test_egress_crash.py",
            "test_egress_schema.py",
            "test_egress_transport.py",
            "test_nrc_fresh.py",
            "test_nrc_strict_parse.py",
            "test_sciencebase_fresh.py",
            "test_sciencebase_locator_live_shape.py",
        )
        files = sorted({
            f for pat in patterns for f in glob.glob(f"./backend/tests/{pat}")
        })
        if not files:
            raise SystemExit("No backend API test files found.")

        collect = subprocess.run(
            [sys.executable, "-m", "pytest", "--collect-only", "-q", *files],
            capture_output=True,
            text=True,
        )
        if collect.returncode != 0:
            sys.stdout.write(collect.stdout)
            sys.stderr.write(collect.stderr)
            raise SystemExit(collect.returncode)

        nodeids = [
            line.strip()
            for line in collect.stdout.splitlines()
            if "::" in line and line.strip().startswith("backend/tests/")
        ]
        if not nodeids:
            raise SystemExit("Layer 3 backend pytest collection produced no nodeids.")

        selected = [
            nodeid
            for index, nodeid in enumerate(nodeids)
            if index % total == shard - 1
        ]
        if not selected:
            raise SystemExit(
                f"Layer 3 backend pytest shard {shard}/{total} selected no tests "
                f"from {len(nodeids)} collected tests."
            )

        print(
            f"Layer 3 backend pytest shard {shard}/{total} selected "
            f"{len(selected)} of {len(nodeids)} tests."
        )
        completed = subprocess.run([sys.executable, "-m", "pytest", *selected, "-q"])
        raise SystemExit(completed.returncode)
        PY
        echo "backend_layer3_api_shard_${{ matrix.shard }}_seconds=$SECONDS"

  backend-layer3-api:
    name: backend-layer3-api
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: backend-layer3-api-shard
    if: ${{ always() }}
    steps:
    - name: Check backend shard results
      run: |
        if [ "${{ needs.backend-layer3-api-shard.result }}" != "success" ]; then
          echo "Layer 3 backend pytest shard result: ${{ needs.backend-layer3-api-shard.result }}"
          exit 1
        fi
        echo "All Layer 3 backend pytest shards passed."
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: ./backend/tests/requirements-layer3-api.txt
    - name: Install Layer 3 API test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r ./backend/tests/requirements-layer3-api.txt
    - name: Run serial dual-live evaluator census
      env:
        CONNECTOR_LIVE_EGRESS_ENABLED: "false"
        PYTHONDONTWRITEBYTECODE: "1"
        PYTHONPYCACHEPREFIX: ${{ runner.temp }}/project6-pycache
      run: |
        cd backend
        python -m pytest tests/test_dual_eval.py -p no:cacheprovider -p no:xdist -ra --tb=short -q

  root-tests-shard:
    name: root-tests-shard-${{ matrix.shard }}/4
    timeout-minutes: 25
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: ./backend/tests/requirements-layer3-api.txt
    - name: Install root test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r ./backend/tests/requirements-layer3-api.txt
    - name: Run repo-root pytest guardrail
      env:
        PYTEST_ROOT_SHARD_INDEX: ${{ matrix.shard }}
        PYTEST_ROOT_SHARD_TOTAL: 4
      run: |
        SECONDS=0
        python <<'PY'
        import glob
        import os
        import subprocess
        import sys

        shard = int(os.environ["PYTEST_ROOT_SHARD_INDEX"])
        total = int(os.environ["PYTEST_ROOT_SHARD_TOTAL"])
        if shard < 1 or shard > total:
            raise SystemExit(f"Invalid root pytest shard {shard}/{total}")

        # Repo-root tests are not covered by backend/tests shards. They are
        # intentionally collected from root and sharded separately to keep
        # root harness, NRC APS, parser, and structural tests visible in CI.
        files = sorted(glob.glob("./tests/test_*.py"))
        if not files:
            raise SystemExit("No repo-root pytest files found.")

        collect = subprocess.run(
            [sys.executable, "-m", "pytest", "--collect-only", "-q", *files],
            capture_output=True,
            text=True,
        )
        if collect.returncode != 0:
            sys.stdout.write(collect.stdout)
            sys.stderr.write(collect.stderr)
            raise SystemExit(collect.returncode)

        nodeids = [
            line.strip()
            for line in collect.stdout.splitlines()
            if "::" in line and line.strip().startswith("tests/")
        ]
        if not nodeids:
            raise SystemExit("Repo-root pytest collection produced no nodeids.")

        selected = [
            nodeid
            for index, nodeid in enumerate(nodeids)
            if index % total == shard - 1
        ]
        if not selected:
            raise SystemExit(
                f"Repo-root pytest shard {shard}/{total} selected no tests "
                f"from {len(nodeids)} collected tests."
            )

        print(
            f"Repo-root pytest shard {shard}/{total} selected "
            f"{len(selected)} of {len(nodeids)} tests."
        )
        completed = subprocess.run([sys.executable, "-m", "pytest", *selected, "-q"])
        raise SystemExit(completed.returncode)
        PY
        echo "root_tests_shard_${{ matrix.shard }}_seconds=$SECONDS"

  root-tests:
    name: root-tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: root-tests-shard
    if: ${{ always() }}
    steps:
    - name: Check root test shard results
      run: |
        if [ "${{ needs.root-tests-shard.result }}" != "success" ]; then
          echo "Repo-root pytest shard result: ${{ needs.root-tests-shard.result }}"
          exit 1
        fi
        echo "All repo-root pytest shards passed."

  dual-gate-windows:
    name: dual-gate-windows
    timeout-minutes: 30
    runs-on: windows-latest
    env:
      CONNECTOR_LIVE_EGRESS_ENABLED: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: ./backend/tests/requirements-layer3-api.txt
    - name: Install dual-live gate test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r ./backend/tests/requirements-layer3-api.txt
    - name: Run complete dual-live gate suite serially
      shell: pwsh
      run: |
        $forbidden = @(
          "CONNECTOR_LIVE_EGRESS_ENABLED",
          "CONNECTOR_CAMPAIGN_DEFINITION_PATH",
          "CONNECTOR_CAMPAIGN_DEFINITION_SHA256",
          "CONNECTOR_SCIENCEBASE_GRANT_PATH",
          "CONNECTOR_SCIENCEBASE_GRANT_SHA256",
          "CONNECTOR_NRC_APS_GRANT_PATH",
          "CONNECTOR_NRC_APS_GRANT_SHA256",
          "NRC_ADAMS_APS_SUBSCRIPTION_KEY",
          "GH_TOKEN",
          "GITHUB_TOKEN"
        )
        foreach ($name in $forbidden) {
          Remove-Item "Env:$name" -ErrorAction SilentlyContinue
        }
        $present = @($forbidden | Where-Object { Test-Path "Env:$_" })
        if ($present.Count -ne 0) {
          throw "Dual-live Windows CI authority environment must be absent."
        }
        python -m pytest ./tests/test_dual_gate.py -p no:cacheprovider -p no:xdist -ra --tb=short -q

  sec-xbrl-arelle-provisioning:
    name: sec-xbrl-arelle-provisioning
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          ./backend/tests/requirements-layer3-arelle.txt
          ./backend/tests/requirements-layer3-api.txt
          ./backend/requirements-sec-xbrl.txt
    - name: Install optional SEC XBRL Arelle dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r ./backend/tests/requirements-layer3-arelle.txt
    - name: Provision pinned SEC XBRL taxonomy packages
      env:
        SEC_XBRL_ARELLE_TAXONOMY_DIR: ${{ runner.temp }}/sec-xbrl-taxonomy
        SEC_XBRL_ARELLE_CACHE_DIR: ${{ runner.temp }}/sec-xbrl-cache
      run: |
        python ./tools/sec-xbrl-arelle-provision.py \
          --taxonomy-dir "$SEC_XBRL_ARELLE_TAXONOMY_DIR" \
          --cache-dir "$SEC_XBRL_ARELLE_CACHE_DIR" \
          --report "$RUNNER_TEMP/sec-xbrl-arelle-provisioning-report.json"
    - name: Run Arelle readiness and fail-closed tests
      env:
        SEC_XBRL_ARELLE_TAXONOMY_PACKAGES: ${{ runner.temp }}/sec-xbrl-taxonomy/us-gaap-2025.zip:${{ runner.temp }}/sec-xbrl-taxonomy/srt-2025.zip
        SEC_XBRL_ARELLE_CACHE_DIR: ${{ runner.temp }}/sec-xbrl-cache
        SEC_XBRL_ARELLE_INTERNET_CONNECTIVITY: offline
      run: |
        python -m pytest \
          ./backend/tests/test_sec_xbrl_arelle_provisioning.py \
          ./backend/tests/test_sec_xbrl_arelle_helper.py \
          ./backend/tests/test_sec_xbrl_sidecar.py \
          ./backend/tests/test_sec_xbrl_a7_chain_ci_durability.py \
          ./backend/tests/test_sec_xbrl_value_reveal_authority_provisioning_preflight.py \
          ./backend/tests/test_sec_xbrl_stratified_real_filing_validation_matrix_preflight.py \
          ./backend/tests/test_sec_xbrl_a7_real_arelle_resolution.py \
          -q

  nrc-aps-ocr:
    name: nrc-aps-ocr
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: ./backend/tests/requirements-layer3-api.txt
    - name: Install Tesseract OCR
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr
        tesseract --version
    - name: Install NRC APS OCR test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r ./backend/tests/requirements-layer3-api.txt
    - name: Run NRC APS OCR proof with required OCR
      env:
        NRC_APS_CORPUS_OCR_MODE: required
      run: |
        set -euo pipefail
        proof_dir="$RUNNER_TEMP/nrc-aps-ocr"
        report="$proof_dir/document-processing-proof.json"
        mkdir -p "$proof_dir"

        set +e
        python tools/run_nrc_aps_document_processing_proof.py --require-ocr \
          --runtime-root "$proof_dir/runtime" \
          --report "$report" \
          --artifact-report "$proof_dir/artifact-ingestion-report.json" \
          --content-index-report "$proof_dir/content-index-report.json"
        proof_status=$?
        set -e

        if [ "$proof_status" -ne 0 ]; then
          echo "NRC APS OCR proof failed with exit code $proof_status"
          if [ -f "$report" ]; then
            python - "$report" <<'PY'
        import json
        import sys
        from pathlib import Path

        payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
        print("failure_reason=", payload.get("failure_reason"))
        print("tesseract_available=", payload.get("tesseract_available"))
        print("ocr_success_proven=", payload.get("ocr_success_proven"))
        for command in payload.get("commands") or []:
            print(
                "command=",
                command.get("label"),
                "exit=",
                command.get("exit_code"),
                "passed=",
                command.get("passed"),
            )
        PY
          fi
          exit "$proof_status"
        fi
    - name: Verify NRC APS OCR proof executed
      run: |
        set -euo pipefail
        python - <<'PY'
        import json
        import os
        from pathlib import Path

        report = Path(os.environ["RUNNER_TEMP"]) / "nrc-aps-ocr" / "document-processing-proof.json"
        payload = json.loads(report.read_text(encoding="utf-8"))
        failures = []
        if payload.get("ocr_mode") != "required":
            failures.append("ocr_mode_not_required")
        if payload.get("passed") is not True:
            failures.append("proof_not_passed")
        if payload.get("tesseract_available") is not True:
            failures.append("tesseract_not_available")
        if payload.get("ocr_success_proven") is not True:
            failures.append("ocr_success_not_proven")

        commands = payload.get("commands") or []
        labels = {command.get("label") for command in commands}
        for label in ("lower_layer_pytest", "api_proof_pytest"):
            if label not in labels:
                failures.append(f"missing_{label}")

        combined_output = "\n".join(
            str(command.get("stdout") or "") + "\n" + str(command.get("stderr") or "")
            for command in commands
        ).lower()
        for forbidden in (
            "tesseract unavailable",
            "tesseract_required",
            "ocr_required_but_unavailable",
            "skipped",
        ):
            if forbidden in combined_output:
                failures.append(f"forbidden_fallback:{forbidden}")

        if failures:
            raise SystemExit("NRC APS OCR proof did not execute cleanly: " + ", ".join(failures))

        print("NRC APS OCR proof executed with required OCR and real Tesseract.")
        PY

  playwright-shard:
    name: test-shard-${{ matrix.shard }}/4
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: ./package-lock.json
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          ./backend/tests/requirements-browser.txt
          ./backend/tests/requirements-layer3-api.txt
    - name: Install dependencies
      run: npm ci
    - name: Install browser harness dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r ./backend/tests/requirements-browser.txt
    - name: Install Playwright Browsers
      run: |
        SECONDS=0
        if command -v google-chrome >/dev/null 2>&1; then
          google-chrome --version
          echo "PLAYWRIGHT_USE_SYSTEM_CHROME=1" >> "$GITHUB_ENV"
        else
          timeout 600s npx playwright install --only-shell chromium
        fi
        echo "playwright_browser_install_seconds=$SECONDS"
    - name: Run Playwright tests
      env:
        PLAYWRIGHT_SHARD_INDEX: ${{ matrix.shard }}
        PLAYWRIGHT_SHARD_TOTAL: 4
      run: |
        SECONDS=0
        node <<'NODE'
        const { execSync } = require('node:child_process');
        const fs = require('node:fs');

        const shard = Number(process.env.PLAYWRIGHT_SHARD_INDEX);
        const total = Number(process.env.PLAYWRIGHT_SHARD_TOTAL);
        if (!Number.isInteger(shard) || !Number.isInteger(total) || shard < 1 || shard > total) {
          throw new Error(`Invalid Playwright shard ${shard}/${total}`);
        }

        const output = execSync('npx playwright test --list --project=chromium --reporter=json', {
          encoding: 'utf8',
          stdio: ['ignore', 'pipe', 'inherit'],
        });
        const data = JSON.parse(output);
        const specs = [];
        function visit(suite) {
          for (const spec of suite.specs || []) specs.push(spec.title);
          for (const child of suite.suites || []) visit(child);
        }
        for (const suite of data.suites || []) visit(suite);
        const selected = specs.filter((_, index) => index % total === shard - 1);
        if (!selected.length) {
          throw new Error(`Playwright shard ${shard}/${total} selected no tests from ${specs.length} specs`);
        }
        const escapeRegExp = (value) => value.replace(/[|\\{}()[\]^$+*?.]/g, '\\$&');
        fs.writeFileSync('playwright-shard-grep.txt', `(${selected.map(escapeRegExp).join('|')})`);
        console.log(`Playwright shard ${shard}/${total} selected ${selected.length} of ${specs.length} tests.`);
        NODE
        npx playwright test --project=chromium --grep "$(cat playwright-shard-grep.txt)"
        echo "playwright_test_shard_${{ matrix.shard }}_seconds=$SECONDS"
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-shard-${{ matrix.shard }}
        path: playwright-report/
        retention-days: 30

  backend-coverage:
    name: backend-coverage
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: ./backend/tests/requirements-layer3-api.txt
    - name: Install Layer 3 API test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r ./backend/tests/requirements-layer3-api.txt
    - name: Run Layer 3 coverage (xdist)
      # Targets: backend/app/api/layer3 package and the sec-xbrl in-app auth
      # policy service. Coverage floor is set to 90%, matching the enforced
      # --cov-fail-under=90 release threshold below.
      env:
        DB_INIT_MODE: none
      run: |
        cd backend
        python -m pytest tests/test_layer3_*.py -q -n auto \
          --cov=app.api.layer3 \
          --cov=app.services.layer3_sec_xbrl_in_app_auth_policy \
          --cov-report=term \
          --cov-fail-under=90

  backend-migrations-postgres:
    name: backend-migrations-postgres
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: ./backend/tests/requirements-layer3-api.txt
    - name: Install Layer 3 API test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r ./backend/tests/requirements-layer3-api.txt
    - name: Run alembic upgrade head against Postgres
      env:
        DB_INIT_MODE: none
        DATABASE_URL: postgresql+psycopg://testuser:testpassword@localhost:5432/testdb
      run: |
        cd backend
        python -m alembic -c alembic.ini upgrade head
    - name: Run Postgres migration tests
      env:
        DB_INIT_MODE: none
        DATABASE_URL: postgresql+psycopg://testuser:testpassword@localhost:5432/testdb
        LAYER3_MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://testuser:testpassword@localhost:5432/testdb
      run: |
        cd backend
        python -m pytest tests/test_layer3_migrations.py -v
    - name: Run 3C golden-path tests against Postgres
      env:
        DB_INIT_MODE: none
        DATABASE_URL: postgresql+psycopg://testuser:testpassword@localhost:5432/testdb
        LAYER3_GOLDEN_PATH_TEST_DATABASE_URL: postgresql+psycopg://testuser:testpassword@localhost:5432/testdb
      run: |
        cd backend
        python -m pytest tests/test_layer3_3c_golden_path.py -v

  release-gate:
    name: release-gate
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs:
      - release-lock-install
      - backend-layer3-api
      - backend-coverage
      - backend-migrations-postgres
      - sec-xbrl-arelle-provisioning
      - root-tests
      - dual-gate-windows
      - nrc-aps-ocr
      - test
    if: ${{ always() }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: ./backend/tests/requirements-layer3-api.txt
    - name: Install release gate dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r ./backend/tests/requirements-layer3-api.txt
    - name: Check manifest-backed CI jobs
      run: |
        set -euo pipefail
        failed=0
        for item in \
          "release-lock-install:${{ needs['release-lock-install'].result }}" \
          "backend-layer3-api:${{ needs['backend-layer3-api'].result }}" \
          "backend-coverage:${{ needs['backend-coverage'].result }}" \
          "backend-migrations-postgres:${{ needs['backend-migrations-postgres'].result }}" \
          "sec-xbrl-arelle-provisioning:${{ needs['sec-xbrl-arelle-provisioning'].result }}" \
          "root-tests:${{ needs['root-tests'].result }}" \
          "dual-gate-windows:${{ needs['dual-gate-windows'].result }}" \
          "nrc-aps-ocr:${{ needs['nrc-aps-ocr'].result }}" \
          "test:${{ needs['test'].result }}"
        do
          job="${item%%:*}"
          result="${item#*:}"
          if [ "$result" != "success" ]; then
            echo "Release gate dependency failed: $job -> $result"
            failed=1
          fi
        done
        exit "$failed"
    - name: Run release readiness manifest gate
      env:
        DB_INIT_MODE: none
        PROJECT6_SOURCE_SHA: ${{ github.sha }}
      run: |
        python ./scripts/release_readiness_check.py
    - name: Run final 0.3.0 SEC XBRL offline acceptance capstone
      env:
        DB_INIT_MODE: none
        PROJECT6_SOURCE_SHA: ${{ github.sha }}
        PROJECT6_CI_BACKEND_LAYER3_API_RESULT: ${{ needs['backend-layer3-api'].result }}
      run: |
        python ./scripts/rc3_sec_xbrl_offline_acceptance.py --json

  test:
    name: test
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: playwright-shard
    if: ${{ always() }}
    steps:
    - name: Check Playwright shard results
      run: |
        if [ "${{ needs.playwright-shard.result }}" != "success" ]; then
          echo "Playwright shard result: ${{ needs.playwright-shard.result }}"
          exit 1
        fi
        echo "All Playwright shards passed."
