# Production compose stack: app + postgres + nginx auth proxy
#
# USAGE:
#   1. Copy deploy/.env.deploy.example -> deploy/.env and fill in every <REPLACE> value.
#   2. Generate deploy/proxy/htpasswd and deploy/proxy/roles.map (see those .example files).
#   3. From the repo root:
#        docker compose -f deploy/docker-compose.production.yml --env-file deploy/.env up -d --build
#
# SECURITY:
#   - The app container has NO host port mapping; traffic must flow through the proxy.
#   - The proxy performs HTTP Basic Auth and injects identity/role headers.
#   - TLS must terminate at or before the proxy — see nginx.conf for the TLS note.
#   - Never expose port 8000 directly to the internet.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: layer3
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d layer3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: ..
      dockerfile: Dockerfile.app
      args:
        PROJECT6_SOURCE_SHA: ${PROJECT6_SOURCE_SHA:-unknown}
    environment:
      # --- Deployment posture (required by nonlocal validator) ---
      DEPLOYMENT_MODE: nonlocal
      AUTH_OWNER: proxy
      TRUSTED_PROXY_MODE: "true"

      # --- Proxy identity/role headers (must match nginx.conf proxy_set_header names) ---
      PROXY_IDENTITY_HEADER: X-Forwarded-User
      PROXY_EMAIL_HEADER: X-Forwarded-Email
      PROXY_GROUPS_HEADER: X-Forwarded-Groups
      PROXY_ROLES_HEADER: X-Forwarded-Roles

      # --- Role enforcement ---
      LAYER3_ROUTE_AUTHORIZATION_MODE: role_enforcing
      LAYER3_OWNER_ROLE_TOKENS: owner
      LAYER3_AUDITOR_ROLE_TOKENS: auditor

      # --- Database ---
      # POSTGRES_PASSWORD is embedded in a URL: it must contain only
      # URL-safe characters (recommend 32+ chars of [A-Za-z0-9_-]; hex is
      # ideal). A password containing @ : / ? # % would misparse here even
      # though postgres itself accepts it. Operators who need such a
      # password can set the full DATABASE_URL (percent-encoded) in
      # deploy/.env instead — it takes precedence over this default.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:${POSTGRES_PASSWORD}@db:5432/layer3}
      # Entrypoint runs alembic upgrade head; suppress redundant in-process run.
      DB_INIT_MODE: none

      # --- CORS ---
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      CORS_ALLOW_CREDENTIALS: "true"

      # --- Storage ---
      # STORAGE_DIR is pinned to the named-volume mount path; must NOT be
      # operator-overridable so the volume mount and the app path stay aligned.
      # Keep outside /app because live SEC egress writes raw-bearing artifacts.
      STORAGE_DIR: /var/lib/project6/storage
      # (nonlocal forbids enabled/proxy_protected)
      STORAGE_EXPOSURE: auto

      # --- Export outbox ---
      # Defaults to the export_data named-volume mount.  Override only when
      # mounting a host path or external volume at a different container path.
      LAYER3_EXTERNAL_LOCAL_EXPORT_DIR: ${LAYER3_EXTERNAL_LOCAL_EXPORT_DIR:-/app/export-outbox}

      # --- Observability ---
      LAYER3_LOG_FORMAT: json

      # --- Arelle fact-authority (required by nonlocal validator when cutover is enabled) ---
      LAYER3_SEC_EDGAR_ARELLE_FACT_AUTHORITY_CUTOVER_ENABLED: "true"
      LAYER3_SEC_EDGAR_ARELLE_FACT_AUTHORITY_NONLOCAL_AUTHORIZED: "true"

      # --- SEC live network (operator-owned via deploy/.env; defaults keep it OFF) ---
      # --env-file only feeds compose interpolation — values reach the app
      # container only because they are threaded through here explicitly.
      LAYER3_SEC_EDGAR_LIVE_NETWORK_ENABLED: ${LAYER3_SEC_EDGAR_LIVE_NETWORK_ENABLED:-false}
      LAYER3_SEC_EDGAR_USER_AGENT: ${LAYER3_SEC_EDGAR_USER_AGENT:-}

      # --- Optional operator knobs (threaded with config.py Field defaults) ---
      # Signed-reference HMAC secret; empty = signed-reference routes stay 409-blocked.
      LAYER3_SIGNED_REFERENCE_SECRET: ${LAYER3_SIGNED_REFERENCE_SECRET:-}
      # Ticker resolution and package inventory (both default OFF; enable for production posture).
      LAYER3_SEC_EDGAR_OFFICIAL_TICKER_RESOLUTION_ENABLED: ${LAYER3_SEC_EDGAR_OFFICIAL_TICKER_RESOLUTION_ENABLED:-false}
      LAYER3_ANALYSIS_PRODUCT_PACKAGE_INVENTORY_ENABLED: ${LAYER3_ANALYSIS_PRODUCT_PACKAGE_INVENTORY_ENABLED:-false}
      # Upload and application identity.
      PROJECT6_SOURCE_SHA: ${PROJECT6_SOURCE_SHA:-unknown}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-64}
      APP_NAME: ${APP_NAME:-Method-Aware Framework}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      # Connector runtime limits.
      CONNECTOR_LEASE_TTL_SECONDS: ${CONNECTOR_LEASE_TTL_SECONDS:-120}
      CONNECTOR_SUBMISSION_TTL_HOURS: ${CONNECTOR_SUBMISSION_TTL_HOURS:-24}
      CONNECTOR_MAX_REDIRECTS: ${CONNECTOR_MAX_REDIRECTS:-3}
      CONNECTOR_MAX_CONCURRENT_RUNS: ${CONNECTOR_MAX_CONCURRENT_RUNS:-1}
      CONNECTOR_MAX_DOWNLOADS_PER_RUN: ${CONNECTOR_MAX_DOWNLOADS_PER_RUN:-1}
      CONNECTOR_PER_HOST_FETCH_LIMIT: ${CONNECTOR_PER_HOST_FETCH_LIMIT:-2}
      # Outbound connector API endpoints and credentials.
      NRC_ADAMS_APS_API_BASE_URL: ${NRC_ADAMS_APS_API_BASE_URL:-https://adams-api.nrc.gov}
      NRC_ADAMS_APS_SUBSCRIPTION_KEY: ${NRC_ADAMS_APS_SUBSCRIPTION_KEY:-}
      SCIENCEBASE_API_BASE_URL: ${SCIENCEBASE_API_BASE_URL:-https://www.sciencebase.gov/catalog}
      SENATE_LDA_API_BASE_URL: ${SENATE_LDA_API_BASE_URL:-https://lda.senate.gov/api/v1}
      SENATE_LDA_API_KEY: ${SENATE_LDA_API_KEY:-}
      # SEC EDGAR rate-limiting and fetch limits.
      LAYER3_SEC_EDGAR_RATE_LIMIT_PER_SECOND: ${LAYER3_SEC_EDGAR_RATE_LIMIT_PER_SECOND:-1}
      LAYER3_SEC_EDGAR_MAX_BYTES: ${LAYER3_SEC_EDGAR_MAX_BYTES:-25000000}
      LAYER3_SEC_EDGAR_TIMEOUT_SECONDS: ${LAYER3_SEC_EDGAR_TIMEOUT_SECONDS:-20}
      # Internal webhook (optional; empty = disabled).
      LAYER3_INTERNAL_WEBHOOK_URL: ${LAYER3_INTERNAL_WEBHOOK_URL:-}
      LAYER3_INTERNAL_WEBHOOK_DISPLAY_NAME: ${LAYER3_INTERNAL_WEBHOOK_DISPLAY_NAME:-server-configured-internal-webhook}

      # NOTE: The following flags must NEVER be set here and must NEVER be true in CI:
      #   LAYER3_SEC_EDGAR_ARELLE_INTERNAL_VALUE_STORE_ENABLED
      #   LAYER3_SEC_EDGAR_ARELLE_CORPUS_VALIDATION_ENABLED
      #   LAYER3_SEC_EDGAR_ARELLE_VALUE_REVEAL_ENABLED
      #   LAYER3_SEC_XBRL_CONTROLLED_VALUE_REVEAL_SUBMIT_ENABLED
      #   SEC_XBRL_PRODUCTION_ADMISSION_EVALUATOR_ENABLED
    volumes:
      - app_storage:/var/lib/project6/storage
      - export_data:/app/export-outbox
    expose:
      - "8000"
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${PROXY_HTTP_PORT:-8080}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/htpasswd:/etc/nginx/htpasswd:ro
      - ./proxy/roles.map:/etc/nginx/roles.map:ro
    networks:
      - internal
    depends_on:
      # Gated on app health (Dockerfile.app HEALTHCHECK probes /ready) to close
      # the transient-502 window during cold start / migrations. Removing that
      # HEALTHCHECK would deadlock proxy startup.
      app:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    driver: bridge

volumes:
  db_data:
  app_storage:
  export_data:
