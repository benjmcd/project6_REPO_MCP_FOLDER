# Production compose stack: app + postgres + nginx auth proxy
#
# USAGE:
#   1. Copy deploy/.env.deploy.example -> deploy/.env and fill in every <REPLACE> value.
#   2. Generate deploy/proxy/htpasswd and deploy/proxy/roles.map (see those .example files).
#   3. From the repo root:
#        docker compose -f deploy/docker-compose.production.yml --env-file deploy/.env up -d --build
#
# SECURITY:
#   - The app container has NO host port mapping; traffic must flow through the proxy.
#   - The proxy performs HTTP Basic Auth and injects identity/role headers.
#   - TLS must terminate at or before the proxy — see nginx.conf for the TLS note.
#   - Never expose port 8000 directly to the internet.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: layer3
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d layer3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: Dockerfile.app
    environment:
      # --- Deployment posture (required by nonlocal validator) ---
      DEPLOYMENT_MODE: nonlocal
      AUTH_OWNER: proxy
      TRUSTED_PROXY_MODE: "true"

      # --- Proxy identity/role headers (must match nginx.conf proxy_set_header names) ---
      PROXY_IDENTITY_HEADER: X-Forwarded-User
      PROXY_EMAIL_HEADER: X-Forwarded-Email
      PROXY_GROUPS_HEADER: X-Forwarded-Groups
      PROXY_ROLES_HEADER: X-Forwarded-Roles

      # --- Role enforcement ---
      LAYER3_ROUTE_AUTHORIZATION_MODE: role_enforcing
      LAYER3_OWNER_ROLE_TOKENS: owner
      LAYER3_AUDITOR_ROLE_TOKENS: auditor

      # --- Database ---
      DATABASE_URL: "postgresql+psycopg://app:${POSTGRES_PASSWORD}@db:5432/layer3"
      # Entrypoint runs alembic upgrade head; suppress redundant in-process run.
      DB_INIT_MODE: none

      # --- CORS ---
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      CORS_ALLOW_CREDENTIALS: "true"

      # --- Storage (nonlocal forbids enabled/proxy_protected) ---
      STORAGE_EXPOSURE: auto

      # --- Observability ---
      LAYER3_LOG_FORMAT: json

      # --- Arelle fact-authority (required by nonlocal validator when cutover is enabled) ---
      LAYER3_SEC_EDGAR_ARELLE_FACT_AUTHORITY_CUTOVER_ENABLED: "true"
      LAYER3_SEC_EDGAR_ARELLE_FACT_AUTHORITY_NONLOCAL_AUTHORIZED: "true"

      # --- SEC live network: operator sets this in deploy/.env when ready ---
      # LAYER3_SEC_EDGAR_LIVE_NETWORK_ENABLED is intentionally left to deploy/.env
      # (default false). Set LAYER3_SEC_EDGAR_USER_AGENT there too when enabling.

      # NOTE: The following flags must NEVER be set here and must NEVER be true in CI:
      #   LAYER3_SEC_EDGAR_ARELLE_INTERNAL_VALUE_STORE_ENABLED
      #   LAYER3_SEC_EDGAR_ARELLE_CORPUS_VALIDATION_ENABLED
      #   LAYER3_SEC_EDGAR_ARELLE_VALUE_REVEAL_ENABLED
      #   LAYER3_SEC_XBRL_CONTROLLED_VALUE_REVEAL_SUBMIT_ENABLED
      #   SEC_XBRL_PRODUCTION_ADMISSION_EVALUATOR_ENABLED
    expose:
      - "8000"
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${PROXY_HTTP_PORT:-8080}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/htpasswd:/etc/nginx/htpasswd:ro
      - ./proxy/roles.map:/etc/nginx/roles.map:ro
    networks:
      - internal
    depends_on:
      - app
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  db_data:
