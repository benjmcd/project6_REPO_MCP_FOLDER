# nginx.conf — Layer 3 production auth proxy
#
# TLS NOTE: This configuration handles HTTP (port 80) only.
# In real deployments, TLS must terminate at or before this proxy.
# Options:
#   a) Put a TLS-terminating load balancer (e.g. AWS ALB, GCP HTTPS LB,
#      Cloudflare, or an outer nginx with SSL certs) in front of this container.
#   b) Add an HTTPS server block here with ssl_certificate/ssl_certificate_key
#      and redirect port 80 -> 443.
# Never expose the app directly without TLS in production.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Role mapping: authenticated username -> role token.
    # The roles.map file contains lines of the form:
    #   "username" "role";
    # Users absent from the map get an empty string (access denied below).
    map $remote_user $layer3_roles {
        default "";
        include /etc/nginx/roles.map;
    }

    server {
        listen 80;
        server_name _;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Allow uploads up to MAX_UPLOAD_MB (matches app setting)
        client_max_body_size 64m;

        # Basic auth gate — rejects unauthenticated requests with 401.
        auth_basic "Layer 3 Operator Access";
        auth_basic_user_file /etc/nginx/htpasswd;

        # Role authorization happens in the app, not here. The proxy's job is
        # authentication + header injection only. An authenticated user absent
        # from roles.map is forwarded with an empty X-Forwarded-Roles header,
        # which the app rejects (401 missing role authority) on every protected
        # route under LAYER3_ROUTE_AUTHORIZATION_MODE=role_enforcing.
        # (An nginx `if`/`return` gate here would run in the rewrite phase,
        # BEFORE auth_basic's access phase, turning unauthenticated requests
        # into 403s without a WWW-Authenticate challenge — do not add one.)

        location / {
            proxy_pass http://app:8000;

            # Inject operator identity headers derived server-side.
            # These unconditionally overwrite any client-supplied values,
            # preventing header spoofing attacks.
            proxy_set_header X-Forwarded-User  $remote_user;
            proxy_set_header X-Forwarded-Email $remote_user;
            proxy_set_header X-Forwarded-Groups layer3-operators;
            proxy_set_header X-Forwarded-Roles $layer3_roles;

            # Standard proxy headers
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;

            # Disable buffering for streaming/SSE responses if needed
            proxy_buffering off;
        }
    }
}
